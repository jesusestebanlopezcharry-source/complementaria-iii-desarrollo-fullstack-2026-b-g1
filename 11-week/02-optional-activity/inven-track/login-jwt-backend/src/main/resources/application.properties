spring.application.name=inven-track

# Base de datos en memoria (H2) para desarrollo
spring.datasource.url=jdbc:h2:mem:inventrackdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Seguridad (JWT) ---
# En produccion SIEMPRE se sobreescribe con variables de entorno.
# El secreto debe tener al menos 32 caracteres.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Usuario inicial (se crea al arrancar si no existe) ---
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
